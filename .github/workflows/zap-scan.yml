name: OWASP ZAP scans
on:
    pull_request:
        paths-ignore:
            - '.txt'
            - 'LICENSE'
            - 'docs/**'
        branches: [ main ]
    push:
        branches:
            - main
    schedule:
        - cron: '41 4 * * 1'

permissions:
    contents: read

jobs:
    zap-scan:
        name: OWASP ZAP scans
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   name: Set up JDK
                uses: ./.github/actions/java-setup
                with:
                    cache: 'maven'
            -   name: Package WebGoat
                run: ./mvnw --no-transfer-progress -DskipTests -Plocal-server package
            -   name: Start WebGoat and register scanner
                shell: bash
                run: |
                    java -Dwebgoat.server.directory="$RUNNER_TEMP/webgoat" \
                      -Dwebgoat.user.directory="$RUNNER_TEMP/webgoat" \
                      -jar target/webgoat-2026.5-SNAPSHOT.jar \
                      --springdoc.api-docs.enabled=true > "$RUNNER_TEMP/webgoat.log" 2>&1 &
                    ready=false
                    for attempt in {1..60}; do
                      if curl --fail --silent http://127.0.0.1:8080/WebGoat/login >/dev/null; then
                        ready=true
                        break
                      fi
                      sleep 5
                    done
                    if [ "$ready" != true ]; then
                      cat "$RUNNER_TEMP/webgoat.log"
                      exit 1
                    fi
                    curl --fail --silent \
                      --cookie-jar "$RUNNER_TEMP/cookies" \
                      http://127.0.0.1:8080/WebGoat/registration >/dev/null
                    curl --fail --silent --show-error --location \
                      --cookie "$RUNNER_TEMP/cookies" \
                      --cookie-jar "$RUNNER_TEMP/cookies" \
                      --data-urlencode 'username=zapscanner' \
                      --data-urlencode 'password=webgoat' \
                      --data-urlencode 'matchingPassword=webgoat' \
                      --data-urlencode 'agree=agree' \
                      http://127.0.0.1:8080/WebGoat/register.mvc >/dev/null
                env:
                    WEBGOAT_HOST: 0.0.0.0
                    WEBWOLF_HOST: 0.0.0.0
            -   name: ZAP full scan
                uses: zaproxy/action-full-scan@v0.13.0
                with:
                    target: 'http://127.0.0.1:8080/WebGoat/'
                    allow_issue_writing: false
                    fail_action: false
                    cmd_options: '-a -j --client-spider -n .zap/webgoat.context -U zapscanner --hook=/zap/wrk/.zap/hooks.py'
                    artifact_name: zap-full-webgoat
            -   name: ZAP API scan
                uses: zaproxy/action-api-scan@v0.10.0
                with:
                    target: 'http://127.0.0.1:8080/WebGoat/v3/api-docs'
                    format: openapi
                    allow_issue_writing: false
                    fail_action: false
                    cmd_options: '-a -n .zap/webgoat.context -U zapscanner'
                    artifact_name: zap-api-webgoat
