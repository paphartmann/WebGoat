name: OWASP ZAP

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: ZAP full and API scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: ./.github/actions/java-setup
        with:
          cache: 'maven'
      - name: Build WebGoat
        run: ./mvnw --no-transfer-progress -DskipTests package
      - name: Start WebGoat
        env:
          WEBGOAT_HOST: 0.0.0.0
          WEBWOLF_HOST: 0.0.0.0
        run: |
          java \
            -Dwebgoat.server.directory="$RUNNER_TEMP/webgoat" \
            -Dwebgoat.user.directory="$RUNNER_TEMP/webgoat" \
            -jar target/webgoat-2026.5-SNAPSHOT.jar \
            --springdoc.api-docs.enabled=true \
            > "$RUNNER_TEMP/webgoat.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/WebGoat/login >/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/webgoat.log"
            exit 1
          fi
          if ! curl --fail --silent http://127.0.0.1:8080/WebGoat/v3/api-docs \
            > "$RUNNER_TEMP/webgoat-openapi.json"; then
            cat "$RUNNER_TEMP/webgoat.log"
            exit 1
          fi
          python -c "import json,sys; paths=json.load(open(sys.argv[1]))['paths']; assert paths, 'WebGoat OpenAPI definition contains no paths'; print(f'OpenAPI definition contains {len(paths)} paths')" \
            "$RUNNER_TEMP/webgoat-openapi.json"
        shell: bash
      - name: ZAP full scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://host.docker.internal:8080/WebGoat/'
          cmd_options: '-m 5'
          artifact_name: zap-full-webgoat
          allow_issue_writing: false
          fail_action: false
      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://host.docker.internal:8080/WebGoat/v3/api-docs'
          format: openapi
          artifact_name: zap-api-webgoat
          allow_issue_writing: false
          fail_action: false
