name: OWASP ZAP scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: ./.github/actions/java-setup
        with:
          cache: 'maven'
      - name: Build WebGoat
        run: ./mvnw --no-transfer-progress -DskipTests package
      - name: Start WebGoat and WebWolf
        run: |
          mkdir -p "$RUNNER_TEMP/webgoat" "$RUNNER_TEMP/zap"
          app_jar=$(find target -maxdepth 1 -name 'webgoat-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          java -jar "$app_jar" \
            --webgoat.port=8080 --webwolf.port=9090 \
            --springdoc.api-docs.enabled=true \
            --webgoat.server.directory="$RUNNER_TEMP/webgoat" \
            --webgoat.user.directory="$RUNNER_TEMP/webgoat" \
            > "$RUNNER_TEMP/webgoat.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/webgoat.pid"
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/WebGoat/login >/dev/null && \
               curl --fail --silent http://127.0.0.1:9090/WebWolf/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/webgoat.log"
          exit 1
      - name: ZAP full scan WebGoat
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: http://127.0.0.1:8080/WebGoat
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: '-a -j -m 10'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-full-scan-webgoat
      - name: ZAP full scan WebWolf
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: http://127.0.0.1:9090/WebWolf
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: '-a -j -m 10'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-full-scan-webwolf
      - name: ZAP API scan WebGoat
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://127.0.0.1:8080/WebGoat/v3/api-docs
          format: openapi
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-api-scan-webgoat
      - name: ZAP API scan WebWolf
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://127.0.0.1:9090/WebWolf/v3/api-docs
          format: openapi
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-api-scan-webwolf
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-application-logs
          path: ${{ runner.temp }}/webgoat.log
          if-no-files-found: warn
      - name: Stop WebGoat
        if: always()
        run: if [ -f "$RUNNER_TEMP/webgoat.pid" ]; then kill "$(cat "$RUNNER_TEMP/webgoat.pid")" || true; fi
